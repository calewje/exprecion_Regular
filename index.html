<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expreción_Regular</title>
</head>

<body>

    <div class="container mt-4">
        <div class="row mb-3 justify-content-center">
            <div class="card justify-content-center" style="width: 30rem; background-color: rgba(255, 255, 255, 0.5);">
                <h1 class="fw-bold text-center">Tester de expresiones regulares</h1>
                <div class="card-body row justify-content-center">
                    <label for="exprecion" class="mt-1">Escribe tu expresion Regular</label>
                    <input type="text" id="exprecion" name="exprecion" placeholder="a-zA-z">

                    <label for="texto" class="mt-2">Comprueba</label>
                    <input type="text" id="texto" name="texto" class="mb-3" placeholder="comprueba texto">

                    <button class="btn btn-primary" id="btn_comprobar" >comprobar texto</button>
                    <div id="resultado" class="mt-3 fs-4 fw-bold"></div>

                </div>
            </div>
        </div>
    </div>

    <script src="./bundle.js"></script>
</body>

</html>
